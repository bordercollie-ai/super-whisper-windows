[project]
name = "super-whisper-windows"
version = "0.1.0"
description = "Tray app: global hotkey -> record -> local faster-whisper -> clipboard/paste"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper",
    "sounddevice",
    "numpy",
    "pyperclip",
    "keyboard",
    "pystray",
    "pillow",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
]
